<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Vox Keys · Reading test</title><style>body{background:#10151d;color:#edf2fa;font:20px/1.65 system-ui;max-width:850px;margin:auto;padding:24px}header{position:sticky;top:0;background:#10151df5;padding:16px 0;border-bottom:1px solid #394352}h1{font-size:26px;margin:0}button{font:inherit;border:0;border-radius:10px;padding:12px 24px;background:#63e0c0;color:#10151d;cursor:pointer}button:disabled{opacity:.5}#status{font-size:16px;color:#b5c6da}p.prompt{padding:22px;background:#1b2431;border-radius:12px}small{color:#83a2bb}a{color:#63e0c0}</style><header><h1>Open Vox Keys · Read once</h1><div id="status">Read all paragraphs at your own pace. Pause briefly between paragraphs. Do not read the numbers.</div><button id="start" disabled>Start recording</button> <button id="stop" disabled>Done</button><a id="download" hidden>Download recording</a></header><main id="texts"></main><script>
let stream,recorder,chunks=[],started,timer,blob;const status=document.querySelector('#status'),start=document.querySelector('#start'),stop=document.querySelector('#stop');
fetch('/prompts.json').then(r=>r.json()).then(a=>{for(let i=0;i<a.length;i++){let p=document.createElement('p');p.className='prompt';let n=document.createElement('small');n.textContent=(i+1)+' / '+a.length;p.append(n,document.createElement('br'),document.createTextNode(a[i]));document.querySelector('#texts').append(p)}start.disabled=false}).catch(()=>status.textContent='Texte konnten nicht geladen werden. Bitte neu laden.');
async function save(){stop.disabled=true;status.textContent='Saving recording locally …';try{let r=await fetch('/recording',{method:'POST',headers:{'Content-Type':blob.type},body:blob});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();status.textContent='Saved. Capture is complete; comparison is a separate step. Recording: '+data.id;stop.hidden=true;}catch(e){status.textContent='Save failed: '+e.message+'. Bitte erneut versuchen oder Download recording.';stop.textContent='Retry save';stop.disabled=false}}
start.onclick=async()=>{start.disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let mime=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());blob=new Blob(chunks,{type:recorder.mimeType});let link=document.querySelector('#download');link.href=URL.createObjectURL(blob);link.download='open-vox-keys-recording.'+(blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'m4a':'webm');link.hidden=false;await save()};recorder.onerror=e=>{status.textContent='Recording error. Press Done to save the captured audio.'};recorder.start(1000);started=Date.now();start.hidden=true;stop.disabled=false;timer=setInterval(()=>{let sec=Math.floor((Date.now()-started)/1000);status.textContent='● Recording · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+' · Read all paragraphs, then press Done.';if(sec>=1200&&recorder.state==='recording')recorder.stop()},500)}catch(e){stream?.getTracks().forEach(t=>t.stop());status.textContent='Could not open microphone: '+e.message;start.disabled=false}};
stop.onclick=()=>{if(recorder?.state==='recording'){stop.disabled=true;recorder.stop()}else if(blob)save()};window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'){e.preventDefault();e.returnValue=''}});
</script></html>
